version: "3.9"

services:
  doctor-patient-portal:
    build:
      context: .
      dockerfile: Dockerfile
    image: doctor-patient-portal:latest
    container_name: doctor-patient-portal
    ports:
      - "8080:8080"
    environment:
      # Database connection (provide your MySQL host/credentials)
      - DB_HOST=${DB_HOST:-localhost}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-hospital}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-}
      # Redis / Spring Session (Amazon ElastiCache or local Redis)
      - REDIS_HOST=${REDIS_HOST:-localhost}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      # Session timeout in seconds (default 30 min)
      - SESSION_TIMEOUT_SECONDS=${SESSION_TIMEOUT_SECONDS:-1800}
      # JVM options
      - JAVA_OPTS=-Xms256m -Xmx512m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
      - TZ=UTC
    volumes:
      - ./logs:/opt/tomcat/logs
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

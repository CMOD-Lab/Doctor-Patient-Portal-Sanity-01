# ============================================================
# Database & HikariCP Connection Pool Configuration
# cr-java-0073: Direct JDBC Connections
# Replaces raw DriverManager.getConnection() with HikariCP pool
# targeting Amazon RDS / RDS Proxy endpoints.
# ============================================================
# RDS / RDS Proxy endpoint — override via environment variable DB_HOST
db.host=${DB_HOST:localhost}
db.port=${DB_PORT:3306}
db.name=${DB_NAME:hospital}
db.user=${DB_USER:root}
# DB_PASSWORD is used when DB_SECRET_NAME is not set.
# When DB_SECRET_NAME is set, the password is fetched from AWS Secrets Manager.
db.password=${DB_PASSWORD:}
# AWS Secrets Manager secret name for the DB password (optional)
db.secret.name=${DB_SECRET_NAME:}

# HikariCP pool tuning (all values can be overridden via environment variables)
hikari.maximumPoolSize=${HIKARI_MAX_POOL_SIZE:10}
hikari.minimumIdle=${HIKARI_MIN_IDLE:2}
hikari.connectionTimeout=${HIKARI_CONNECTION_TIMEOUT:30000}
hikari.idleTimeout=${HIKARI_IDLE_TIMEOUT:600000}
hikari.maxLifetime=${HIKARI_MAX_LIFETIME:1800000}
# Keep-alive interval (ms) — prevents RDS Proxy from dropping idle connections
hikari.keepaliveTime=60000
# Pool name for JMX / log identification
hikari.poolName=HmsHikariPool
# Connection validation query
hikari.connectionTestQuery=SELECT 1

# JDBC URL template (resolved at runtime by DBConnection.java)
# jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# For RDS with SSL enabled, set useSSL=true and provide the RDS CA bundle.

# ============================================================
# Amazon ElastiCache for Redis - Spring Session Configuration
# cr-java-0065: HTTP Session State Storage
# ============================================================
# Redis host: set to your ElastiCache cluster endpoint via environment variable
# Default falls back to localhost for local development
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}

# ElastiCache Redis TLS (recommended for production)
# spring.redis.ssl=true

# Redis connection pool settings (Lettuce)
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=0
spring.redis.lettuce.pool.max-wait=-1ms

# Spring Session - use Redis as the session store
spring.session.store-type=redis
# Session timeout (30 minutes)
spring.session.timeout=1800

# Redis session namespace
spring.session.redis.namespace=hms:session
